services:
  taskops:
    container_name: taskops
    image: xct258/taskops:latest
    network_mode: host
    restart: unless-stopped
    # 单进程 FastAPI：页面和 /api 都在 8281，用 tini 回收孤儿进程
    init: true
    stop_grace_period: 15s
    volumes:
      # 应用代码 + SQLite 数据库持久化
      - ./app:/app
      # 模板日志与一次性启动标记
      - ./data:/data
    environment:
      # 统一登录（SSO）：本服务使用自己的服务密码和 Cookie
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - SERVICE_ID=${SERVICE_ID:-taskops}
      - SERVICE_SECRET=${SERVICE_SECRET:-}
      - SERVICE_TOKEN_VERSION=${SERVICE_TOKEN_VERSION:-1}
      - SSO_LOGIN_URL=${SSO_LOGIN_URL:-https://auth.o1-1.xct258.top/login}
      - SSO_COOKIE_NAME=${SSO_COOKIE_NAME:-sso_taskops}
      - SSO_COOKIE_DOMAIN=${SSO_COOKIE_DOMAIN:-.o1-1.xct258.top}
      - SSO_ALLOWED_REDIRECT_SUFFIX=${SSO_ALLOWED_REDIRECT_SUFFIX:-.o1-1.xct258.top}
      - PUSH_SERVER_URL=${PUSH_SERVER_URL:-https://push-server.o1-1.xct258.top}
      - PUSH_SERVER_TOKEN=${PUSH_SERVER_TOKEN:-}
      # 壁纸图片接口地址（支持 {seed}/{width}/{height} 占位符）
      - WALLPAPER_API_URL=${WALLPAPER_API_URL:-https://random-image.xct258.top/}
      # 页面 + API 统一端口（不再单独监听 8481）
      - FRONTEND_PORT=${FRONTEND_PORT:-8281}
      # 模板日志与服务摘要
      - LOG_BASE_DIR=/data/logs
      - SERVICE_PORT=${FRONTEND_PORT:-8281}
